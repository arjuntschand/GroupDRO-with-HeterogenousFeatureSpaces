# Fed-Heart Disease GroupDRO Configuration - KL Lambda 0.05
# Lower KL penalty allows more divergence from π

run_name: fedheart_groupdro_kl0p05
seed: 1337
run_dir: runs/fedheart_groupdro_kl0p05

# Dataset settings
use_fedheart: true
num_classes: 2
stratified_batching: true

# Training settings
batch_size: 32
num_workers: 0
epochs: 50
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0

# Model architecture
latent_dim: 64
head_hidden: 32

# Groups (4 hospitals)
groups:
  - name: hospital_0
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_1
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_2
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_3
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

# Anchor settings
anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

# GroupDRO settings
groupdro_enabled: true
groupdro_eta: 0.1
groupdro_gamma: 0.9
groupdro_update_mode: exp_smooth
groupdro_objective: weighted
groupdro_kl_lambda: 0.05  # Lower KL penalty

# Logging
log_interval: 20
save_every: 10
