# Experiment 4b: Per-group encoders, SEVERE heterogeneity, GroupDRO
# Same feature drops as hetsev_erm; GroupDRO enabled.
run_name: fedheart_exp_hetsev_gdro
seed: 42
run_dir: runs/exp_hetsev_gdro

use_fedheart: true
num_classes: 2
stratified_batching: true
train_frac: 0.66

true_hetero_input_dim: true

feature_mask:
  - [0, 1, 3, 4, 5]                # G0: 5 features
  - [0, 1, 5, 6, 7, 11, 12]        # G1: 7 features
  - [0, 1, 2, 8, 9, 10]            # G2: 6 features
  - [0, 1, 2, 5, 7]                # G3: 5 features

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: true
groupdro_eta: 1.0
groupdro_gamma: 0.9
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true

log_interval: 20
save_every: 10
