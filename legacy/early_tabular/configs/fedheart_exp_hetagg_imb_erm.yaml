# Experiment 5a: Aggressive heterogeneity + group imbalance, ERM
# Combines feature heterogeneity with sample capping to create a setting
# where GroupDRO should help most: minority groups with fewer features.
#
# G2 (Switzerland, 46 total) is already small; cap G3 (VA Long Beach) to 25 train samples.
# This creates: G0=200, G1=172, G2=30, G3=25 training samples.
run_name: fedheart_exp_hetagg_imb_erm
seed: 42
run_dir: runs/exp_hetagg_imb_erm

use_fedheart: true
num_classes: 2
stratified_batching: true
train_frac: 0.66

true_hetero_input_dim: true

group_max_train_samples:
  - null   # G0: all ~200
  - null   # G1: all ~172
  - null   # G2: all ~30 (naturally small)
  - 25     # G3: capped to 25 (artificial minority)

feature_mask:
  - [0, 1, 2, 3, 5, 6, 7, 8, 9, 10]       # G0: 10 features
  - [0, 1, 2, 3, 5, 6, 11, 12]             # G1: 8 features
  - [0, 1, 2, 4, 5, 7, 11, 12]             # G2: 8 features
  - [0, 1, 2, 4, 5, 6, 8, 9, 10]           # G3: 9 features (capped + fewer features)

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
