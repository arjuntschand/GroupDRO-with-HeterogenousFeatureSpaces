# SKEWED + GroupDRO with SOFTMAX update (handles extreme imbalance better)
run_name: fedheart_skewed_groupdro_softmax
seed: 1337
run_dir: runs/fedheart_skewed_groupdro_softmax

use_fedheart: true
num_classes: 2
stratified_batching: true

group_max_train_samples: [150, 150, 10, 15]

batch_size: 64  # larger batch so all groups have samples

num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_1
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_2
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_3
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: true
groupdro_eta: 1.0           # higher eta for sharper softmax
groupdro_gamma: 0.9
groupdro_update_mode: softmax  # direct softmax of losses (no MWU accumulation issues)
groupdro_objective: weighted
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true

log_interval: 20
save_every: 5
