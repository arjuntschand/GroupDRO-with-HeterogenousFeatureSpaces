# TextCaps 10-class BASELINE v3 — Updated with π-proportional weighting
# Groups: visual (group 0), text (group 1)
# Loss: π-weighted per-group loss (sum_g π_g * L_g)
# Stratified sampling to maintain π distribution in batches

run_name: textcaps_10class_baseline_v3
seed: 1337
root: datasets
run_dir: runs/textcaps_10class_baseline_v3

# Dataset: top 10 most frequent classes
use_textcaps_multimodal: true
textcaps_use_huggingface: true
textcaps_num_classes: 10

# Sampling
use_stratified_sampling: true
include_combined_group: false

# Training
batch_size: 32
num_workers: 12
epochs: 50

# Groups (multi-modal)
groups:
  - name: visual
    type: image
    in_shape: [3, 224, 224]
    encoder: resnet_visual
  - name: text_ocr
    type: text
    encoder: char_cnn_text

# Model
latent_dim: 64
num_classes: 10
head_hidden: 128
head_dropout: 0.5

# Encoder settings
freeze_visual_encoder_epochs: 0
visual_encoder_lr_scale: 0.01

# Anchors
anchor_eps: 1.0e-4
sep_samples_per_class: 8
sep_method: "classifier"
sep_margin: 2.0
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3

# Optimizer
optimizer: adam
lr: 1.0e-3
weight_decay: 5.0e-4
lr_start: 1.0e-3
lr_end: 1.0e-4
grad_clip: 1.0

# GroupDRO: DISABLED (baseline)
groupdro_enabled: false

# Logging
log_interval: 20
save_every: 5
