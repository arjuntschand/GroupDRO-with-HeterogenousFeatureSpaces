# VERY SKEWED: majority (G0, G1) full, minority (G2, G3) capped to 5 samples each
# This extreme imbalance should consistently show ERM failing on minority
run_name: fedheart_veryskewed_baseline
seed: 1337
run_dir: runs/fedheart_veryskewed_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

# G2: 30->5 samples, G3: 85->5 samples = EXTREME imbalance (349 majority vs 10 minority)
group_max_train_samples: [null, null, 5, 5]

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_1
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_2
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_3
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 5
