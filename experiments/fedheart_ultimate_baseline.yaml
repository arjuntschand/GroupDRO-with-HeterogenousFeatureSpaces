# ULTIMATE CHALLENGE: All difficulties combined
# 1. Sample imbalance: G2=5, G3=10 samples
# 2. Label noise: 35% on G0, G1
# 3. Feature masking: G1 only sees half the features (hardest group)
# 4. Input noise: G2, G3 get noisy inputs
run_name: fedheart_ultimate_baseline
seed: 1337
run_dir: runs/fedheart_ultimate_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

group_max_train_samples: [null, null, 5, 10]  # G2, G3 minority
label_noise_rate: [0.35, 0.35, 0.0, 0.0]     # noise on majority
feature_mask:
  - null                          # G0: all features
  - [6, 7, 8, 9, 10, 11, 12]     # G1: only last 7 features (harder)
  - null                          # G2: all features
  - null                          # G3: all features
input_noise_std: [0.0, 0.0, 0.3, 0.3]        # noise on minority inputs

batch_size: 64
num_workers: 0
epochs: 200
early_stopping_patience: 50
lr: 0.001
weight_decay: 0.001
optimizer: adamw
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.0001
lambda_sep: 0.0001

groupdro_enabled: false

log_interval: 20
save_every: 10
