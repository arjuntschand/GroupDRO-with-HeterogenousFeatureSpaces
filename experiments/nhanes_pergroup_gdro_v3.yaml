# NHANES CVD: Per-group encoders + GroupDRO (v3 — focal loss for class imbalance)
run_name: nhanes_pergroup_gdro_v3
seed: 42
run_dir: runs/nhanes_pergroup_gdro_v3

use_nhanes: true
num_classes: 2
stratified_batching: true
train_frac: 0.8
use_post_pandemic: true
data_split_seed: 100

batch_size: 128
num_workers: 0
epochs: 120
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0005
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 48

loss_type: focal
focal_gamma: 2.0

common_encoder: false
groups:
  - name: survey_only
    encoder: mlp_tabular_ln
    input_dim: 10
    hidden_dim: 96
    dropout: 0.15
  - name: exam
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 96
    dropout: 0.15
  - name: vitals_labs
    encoder: mlp_tabular_ln
    input_dim: 20
    hidden_dim: 96
    dropout: 0.15

anchor_eps: 0.0001
sep_samples_per_class: 6
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.002
lambda_sep: 0.002

groupdro_enabled: true
groupdro_eta: 1.0
groupdro_gamma: 0.9
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_kl_lambda: 0.0
groupdro_uniform_init: false

log_interval: 20
save_every: 10
