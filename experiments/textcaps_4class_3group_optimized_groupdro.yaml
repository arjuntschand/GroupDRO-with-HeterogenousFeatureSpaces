# TextCaps 4-class GROUPDRO — OPTIMIZED (per HYPERPARAMETER_OPTIMIZATION.md + ADDEDDRO doc)
# Same as 3group_groupdro but: latent_dim=128, head_hidden=256, linear LR decay
# Method reference: documentation/ADDEDDRO_GroupDRO_with_HeterogeneousFeatureSpaces (1) (1).pdf

run_name: textcaps_4class_3group_optimized_groupdro
seed: 1337
root: datasets
run_dir: runs/textcaps_4class_3group_optimized_groupdro

use_textcaps_multimodal: true
textcaps_use_huggingface: true
textcaps_num_classes: 4
textcaps_class_names: ["Bottle", "Car", "Food", "Book"]
textcaps_train_frac: 0.8

use_stratified_sampling: true
include_combined_group: true
fusion_dropout: 0.1
fusion_hidden: 128

batch_size: 32
num_workers: 4
epochs: 50

groups:
  - name: visual
    type: image
    in_shape: [3, 224, 224]
    encoder: resnet_visual
  - name: text_ocr
    type: text
    encoder: char_cnn_text

# OPTIMIZED
latent_dim: 128
num_classes: 4
head_hidden: 256
head_dropout: 0.5

freeze_visual_encoder_epochs: 0
visual_encoder_lr_scale: 0.01

anchor_eps: 1.0e-4
sep_samples_per_class: 8
sep_method: "classifier"
sep_margin: 2.0
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3

optimizer: adam
lr: 1.0e-3
weight_decay: 5.0e-4
lr_start: 1.0e-3
lr_end: 1.0e-4
grad_clip: 1.0

groupdro_enabled: true
groupdro_eta: 0.01
groupdro_gamma: 0.5
groupdro_update_mode: exp_smooth
groupdro_objective: weighted
groupdro_warmup_epochs: 3
groupdro_kl_lambda: 0.1

log_interval: 20
save_every: 5
