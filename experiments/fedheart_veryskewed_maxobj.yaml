# VERY SKEWED + MAX objective (directly optimize worst group loss)
run_name: fedheart_veryskewed_maxobj
seed: 1337
run_dir: runs/fedheart_veryskewed_maxobj

use_fedheart: true
num_classes: 2
stratified_batching: true

group_max_train_samples: [null, null, 5, 5]

batch_size: 64
num_workers: 0
epochs: 150
early_stopping_patience: 40
lr: 0.0005  # lower LR for max objective (more aggressive)
weight_decay: 0.001  # more regularization
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15  # more dropout
  - name: hospital_1
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: hospital_2
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: hospital_3
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: true
groupdro_eta: 0.5
groupdro_gamma: 0.9
groupdro_update_mode: exp_smooth
groupdro_objective: max  # directly minimize worst group loss
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true

log_interval: 20
save_every: 5
