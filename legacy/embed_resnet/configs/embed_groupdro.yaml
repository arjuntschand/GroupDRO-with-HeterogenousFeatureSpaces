# EMBED mammography — full method (anchors + GroupDRO)
# Same as embed_baseline.yaml but with GroupDRO reweighting of tail modality groups.
run_name: embed_groupdro
run_dir: runs/embed_groupdro
data_root: datasets/embed
seed: 42
data_split_seed: 42

# Data
batch_size: 32
num_workers: 4
image_size: 224
train_frac: 0.8
tail_threshold: 0.15
stratified_batching: true
group_max_train_samples: null

# Model
encoder: mammo_multiview
backbone: resnet18
pretrained: true
num_view_types: 4
dropout: 0.2
latent_dim: 128
head_hidden: 256

# Anchors
anchor_eps: 1.0e-4
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3
sep_samples_per_class: 16
sep_method: classifier
sep_margin: 2.0

# Optimization
lr: 5.0e-5
weight_decay: 1.0e-4
epochs: 20
grad_clip: 1.0

# GroupDRO (softmax + uniform init worked best on our tabular datasets;
# tune eta once we see real tail-group behavior)
groupdro_enabled: true
groupdro_eta: 1.0
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_gamma: 0.9
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true

log_interval: 50
