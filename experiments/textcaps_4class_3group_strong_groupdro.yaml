# TextCaps 4-class GROUPDRO — STRONG (for when GroupDRO didn't help worst group)
# Same as strong_baseline but GroupDRO with higher eta/gamma so weights actually shift
# toward worst group. No warmup — DRO from epoch 1.

run_name: textcaps_4class_3group_strong_groupdro
seed: 1337
root: datasets
run_dir: runs/textcaps_4class_3group_strong_groupdro

use_textcaps_multimodal: true
textcaps_use_huggingface: true
textcaps_num_classes: 4
textcaps_class_names: ["Bottle", "Car", "Food", "Book"]
textcaps_train_frac: 0.8

use_stratified_sampling: true
include_combined_group: true
fusion_dropout: 0.1
fusion_type: cross_attn
fusion_num_heads: 4

batch_size: 32
num_workers: 4
epochs: 50

groups:
  - name: visual
    type: image
    in_shape: [3, 224, 224]
    encoder: resnet_visual
  - name: text_ocr
    type: text
    encoder: transformer_text

text_encoder_embed_dim: 128
text_encoder_num_heads: 4
text_encoder_num_layers: 3

latent_dim: 128
num_classes: 4
head_hidden: 256
head_dropout: 0.5

freeze_visual_encoder_epochs: 0
visual_encoder_lr_scale: 0.01

anchor_eps: 1.0e-4
sep_samples_per_class: 8
sep_method: "classifier"
sep_margin: 2.0
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3

optimizer: adam
lr: 1.0e-3
weight_decay: 5.0e-4
lr_start: 1.0e-3
lr_end: 1.0e-4
grad_clip: 1.0

# GroupDRO: higher eta so weights actually move; higher gamma for stability
groupdro_enabled: true
groupdro_eta: 0.05      # was 0.01 — too small, weights barely moved
groupdro_gamma: 0.85    # was 0.5 — stronger smoothing
groupdro_update_mode: exp_smooth
groupdro_objective: weighted
groupdro_warmup_epochs: 0   # no warmup
groupdro_kl_lambda: 0.1

log_interval: 20
save_every: 5
