# Fed-Heart IMBALANCED: baseline ERM
# Group 3 (VA) capped to 20 training samples so ERM underperforms on minority.
# Use with fedheart_imbalanced_groupdro.yaml to show strong GroupDRO gain for paper.

run_name: fedheart_imbalanced_baseline
seed: 1337
run_dir: runs/fedheart_imbalanced_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

# Cap training samples per group: [G0, G1, G2, G3]. None = use all. Here G3 (VA) = 20 samples only.
group_max_train_samples: [null, null, null, 20]

batch_size: 32
num_workers: 0
epochs: 80
early_stopping_patience: 20
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_1
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_2
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_3
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
