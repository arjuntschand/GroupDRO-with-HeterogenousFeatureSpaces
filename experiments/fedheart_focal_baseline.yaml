# FOCAL LOSS + IMBALANCE: baseline
run_name: fedheart_focal_baseline
seed: 1337
run_dir: runs/fedheart_focal_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

group_max_train_samples: [null, null, 5, 5]
label_noise_rate: [0.25, 0.25, 0.0, 0.0]

batch_size: 64
num_workers: 0
epochs: 200
early_stopping_patience: 50
lr: 0.001
weight_decay: 0.001
optimizer: adamw
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

loss_type: focal
focal_gamma: 3.0  # high gamma for more focus on hard examples

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2
  - name: hungarian
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2
  - name: switzerland
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2
  - name: va_long_beach
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.0001
lambda_sep: 0.0001

groupdro_enabled: false

log_interval: 20
save_every: 10
