# EXTREME CHALLENGE: Combines multiple difficulties for ERM
# 1. Sample imbalance: G2, G3 capped to 5 samples
# 2. Label noise: 40% on majority groups
# 3. Deep architecture that can overfit
# This should create a scenario where ERM dramatically fails on minority groups
run_name: fedheart_extreme_challenge_baseline
seed: 1337
run_dir: runs/fedheart_extreme_challenge_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

group_max_train_samples: [null, null, 5, 5]  # severe imbalance
label_noise_rate: [0.4, 0.4, 0.0, 0.0]  # 40% noise on majority

batch_size: 64
num_workers: 0
epochs: 200
early_stopping_patience: 50
lr: 0.002
weight_decay: 0.0005
optimizer: adamw
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

latent_dim: 64
head_hidden: 64

groups:
  - name: cleveland
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.15
  - name: hungarian
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.15
  - name: switzerland
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.15
  - name: va_long_beach
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.15

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.0001
lambda_sep: 0.0001

groupdro_enabled: false

log_interval: 20
save_every: 10
