# NHANES CVD: Expanded features, per-group encoders, GroupDRO
run_name: nhanes_expanded_pergroup_gdro
seed: 42
run_dir: runs/nhanes_expanded_pergroup_gdro
feature_mode: expanded

use_nhanes: true
num_classes: 2
stratified_batching: true
train_frac: 0.8
use_post_pandemic: true
data_split_seed: 100

batch_size: 128
num_workers: 0
epochs: 100
early_stopping_patience: 25
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

common_encoder: false
groups:
  - name: survey_only
    encoder: mlp_tabular_ln
    input_dim: 15
    hidden_dim: 64
    dropout: 0.1
  - name: exam
    encoder: mlp_tabular_ln
    input_dim: 18
    hidden_dim: 64
    dropout: 0.1
  - name: vitals_labs
    encoder: mlp_tabular_ln
    input_dim: 25
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: true
groupdro_eta: 1.0
groupdro_gamma: 0.9
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_kl_lambda: 0.0
groupdro_uniform_init: false

log_interval: 20
save_every: 10
