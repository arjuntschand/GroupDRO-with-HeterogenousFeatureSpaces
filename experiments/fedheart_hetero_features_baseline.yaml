# HETEROGENEOUS FEATURES: Each group sees different subset of features
# This simulates real-world scenarios where hospitals collect different data
# G0: features 0-6 (first half)
# G1: features 7-12 (second half)
# G2: features 0-3, 10-12 (mixed)
# G3: all features (reference)
run_name: fedheart_hetero_features_baseline
seed: 1337
run_dir: runs/fedheart_hetero_features_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

# Feature masks: which features each group can see (others zeroed)
feature_mask:
  - [0, 1, 2, 3, 4, 5, 6]        # G0: first 7 features
  - [7, 8, 9, 10, 11, 12]        # G1: last 6 features (harder!)
  - [0, 1, 2, 3, 10, 11, 12]     # G2: mixed 7 features
  - null                          # G3: all 13 features

batch_size: 64
num_workers: 0
epochs: 150
early_stopping_patience: 40
lr: 0.001
weight_decay: 0.001
optimizer: adamw
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
