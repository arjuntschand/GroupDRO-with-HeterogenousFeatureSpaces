# TextCaps 4-class BASELINE with 3 groups (visual, text, combined)
# Groups: visual (group 0), text (group 1), visual+text combined (group 2)
# The combined group uses a fusion layer to concatenate and project latents
# Loss: π-weighted per-group loss (sum_g π_g * L_g)

run_name: textcaps_4class_3group_baseline
seed: 1337
root: datasets
run_dir: runs/textcaps_4class_3group_baseline

# Dataset: 4 classes (Bottle, Car, Food, Book), 80/20 split
use_textcaps_multimodal: true
textcaps_use_huggingface: true
textcaps_num_classes: 4
textcaps_class_names: ["Bottle", "Car", "Food", "Book"]
textcaps_train_frac: 0.8

# Sampling - 3 groups: each image appears 3x (visual, text, combined)
use_stratified_sampling: true
include_combined_group: true
fusion_dropout: 0.1

# Training
batch_size: 32
num_workers: 8
epochs: 50

# Groups (multi-modal)
groups:
  - name: visual
    type: image
    in_shape: [3, 224, 224]
    encoder: resnet_visual
  - name: text_ocr
    type: text
    encoder: char_cnn_text

# Model
latent_dim: 64
num_classes: 4
head_hidden: 128
head_dropout: 0.5

# Encoder settings
freeze_visual_encoder_epochs: 0
visual_encoder_lr_scale: 0.01

# Anchors
anchor_eps: 1.0e-4
sep_samples_per_class: 8
sep_method: "classifier"
sep_margin: 2.0
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3

# Optimizer
optimizer: adam
lr: 1.0e-3
weight_decay: 5.0e-4
lr_start: 1.0e-3
lr_end: 1.0e-4
grad_clip: 1.0

# GroupDRO: DISABLED (baseline)
groupdro_enabled: false

# Logging
log_interval: 20
save_every: 5
