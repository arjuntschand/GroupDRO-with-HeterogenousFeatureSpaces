# Fed-Heart IMBALANCED: GroupDRO (strong settings for paper)
# Same data as fedheart_imbalanced_baseline (G3 capped to 20 train samples).
# Max objective + zero KL + higher eta = direct worst-group optimization.

run_name: fedheart_imbalanced_groupdro
seed: 1337
run_dir: runs/fedheart_imbalanced_groupdro

use_fedheart: true
num_classes: 2
stratified_batching: true

group_max_train_samples: [null, null, null, 20]

batch_size: 32
num_workers: 0
epochs: 80
early_stopping_patience: 20
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_1
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_2
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_3
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

# Strong GroupDRO for paper: min-max over groups
groupdro_enabled: true
groupdro_eta: 0.3              # aggressive weight update toward high-loss groups
groupdro_gamma: 0.9
groupdro_update_mode: exp_smooth
groupdro_objective: max        # minimize WORST group loss (paper Eq. 20)
groupdro_kl_lambda: 0.0        # no KL so lambda can concentrate on worst group

log_interval: 20
save_every: 10
