# EMBED prototype — smoke test the FULL pipeline on the small local image subset.
# NOT a real result; just proves DICOM->encoder->anchors->GroupDRO->metrics runs
# end-to-end before we move to the AWS GPU box for the full 133k-sample run.
run_name: embed_prototype
run_dir: runs/embed_prototype
data_root: datasets/embed
seed: 42
data_split_seed: 42

require_local_images: true          # <-- only train on downloaded DICOMs

batch_size: 8
num_workers: 2
image_size: 224
train_frac: 0.7
tail_threshold: 0.15
stratified_batching: false          # tiny subset; plain shuffle
group_max_train_samples: null

encoder: mammo_multiview
backbone: resnet18
pretrained: true
num_view_types: 4
dropout: 0.2
latent_dim: 128
head_hidden: 256

anchor_eps: 1.0e-4
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 2.0

lr: 5.0e-5
weight_decay: 1.0e-4
epochs: 2
grad_clip: 1.0

groupdro_enabled: true
groupdro_eta: 1.0
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_gamma: 0.9
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true

log_interval: 10
