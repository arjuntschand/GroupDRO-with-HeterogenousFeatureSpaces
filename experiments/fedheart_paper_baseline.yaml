# Fed-Heart Disease PAPER config: Baseline ERM
# Defensible setup: 80/20 train/test; minority centers (G2, G3) capped at 20/25 train samples
# to simulate severe but realistic cross-center data scarcity (reviewer-ready).
run_name: fedheart_paper_baseline
seed: 1337
run_dir: runs/fedheart_paper_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

# Standard 80/20 train/test split
train_frac: 0.8

# Imbalance: G0/G1 uncapped; G2 (Switzerland) max 20, G3 (VA) max 25 training samples.
# Simulates federated setting where smaller centers have limited data; still enough to learn.
group_max_train_samples: [null, null, 20, 25]

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
