# SKEWED: cap G2 (best performing) and G3 (smallest) -> ERM focuses on G0, G1
# This creates max disparity: ERM ignores minority, GroupDRO upweights them
run_name: fedheart_skewed_baseline
seed: 1337
run_dir: runs/fedheart_skewed_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

# G0: 199 (keep 150), G1: 172 (keep 150), G2: 30->10, G3: 85->15
# Creates massive imbalance: majority 300 vs minority 25
group_max_train_samples: [150, 150, 10, 15]

batch_size: 32
num_workers: 0
epochs: 60
early_stopping_patience: 20
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_1
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_2
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hospital_3
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 5
