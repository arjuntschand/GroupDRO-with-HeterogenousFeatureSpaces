# FAIR COMPARISON: Deep architecture, disjoint features, shared encoder, ERM
run_name: nhanes_disjoint_deep_shared_erm
seed: 42
run_dir: runs/nhanes_disjoint_deep_shared_erm
feature_mode: disjoint

use_nhanes: true
num_classes: 2
stratified_batching: true
train_frac: 0.8
use_post_pandemic: true
data_split_seed: 100

batch_size: 64
num_workers: 0
epochs: 200
early_stopping_patience: 50
lr: 0.0005
weight_decay: 0.001
optimizer: adamw
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

latent_dim: 128
head_hidden: 64

common_encoder: true
groups:
  - name: survey_only
    encoder: mlp_tabular_deep
    input_dim: 25
    hidden_dim: 128
    dropout: 0.2
  - name: exam
    encoder: mlp_tabular_deep
    input_dim: 25
    hidden_dim: 128
    dropout: 0.2
  - name: vitals_labs
    encoder: mlp_tabular_deep
    input_dim: 25
    hidden_dim: 128
    dropout: 0.15

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
lambda_fit: 0.005
lambda_sep: 0.005

groupdro_enabled: false
log_interval: 20
save_every: 10
