# Fed-Heart Disease: Heterogeneous feature spaces with GroupDRO
# Per-group encoders with different feature subsets per hospital site.
# Same feature masking as the hetero baseline; GroupDRO enabled.
#
# Feature dropping (same as hetero_baseline):
# G0: All 13 features | G1: Drop chol | G2: Drop fbs, exang, oldpeak | G3: Drop chol, restecg
run_name: fedheart_hetero_groupdro
seed: 1337
run_dir: runs/fedheart_hetero_groupdro

use_fedheart: true
num_classes: 2
stratified_batching: true

train_frac: 0.66
# No cap: use all training samples per group (natural imbalance only)
group_max_train_samples: null

feature_mask:
  - null                                    # G0: all 13 features
  - [0, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12]  # G1: drop chol (idx 3)
  - [0, 1, 2, 3, 5, 8, 9, 10, 11, 12]         # G2: drop fbs, exang, oldpeak (idx 4,6,7)
  - [0, 1, 2, 4, 5, 6, 7, 8, 9, 10]           # G3: drop chol, restecg (idx 3,11,12)

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: true
groupdro_eta: 1.0
groupdro_gamma: 0.9
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true

log_interval: 20
save_every: 10
