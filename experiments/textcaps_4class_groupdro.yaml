# TextCaps 4-class GroupDRO — Option B (same 4 classes as 2301.11447)
# Bottle, Car, Food, Book. 80% train / 20% test. Same hyperparams as 10-class v2.

run_name: textcaps_4class_groupdro
seed: 1337
root: datasets
run_dir: runs/textcaps_4class_groupdro

# Dataset: 4 classes (same as FLIC paper), 80/20 split
use_textcaps_multimodal: true
textcaps_use_huggingface: true
textcaps_num_classes: 4
textcaps_class_names: ["Bottle", "Car", "Food", "Book"]
textcaps_train_frac: 0.8

# Training (same as 10-class v2). num_workers 0 on Mac to avoid torch_shm_manager crash.
batch_size: 32
num_workers: 0
epochs: 50

groups:
  - name: visual
    type: image
    in_shape: [3, 224, 224]
    encoder: resnet_visual
  - name: text_ocr
    type: text
    encoder: char_cnn_text

latent_dim: 64
num_classes: 4
head_hidden: 128
head_dropout: 0.5

freeze_visual_encoder_epochs: 0
visual_encoder_lr_scale: 0.01

anchor_eps: 1.0e-4
sep_samples_per_class: 8
sep_method: "classifier"
sep_margin: 2.0
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3

optimizer: adam
lr: 1.0e-3
weight_decay: 5.0e-4
lr_start: 1.0e-3
lr_end: 1.0e-4
grad_clip: 1.0

groupdro_enabled: true
groupdro_eta: 0.01
groupdro_gamma: 0.5
groupdro_min_group_weight: 0.05
groupdro_update_mode: exp_smooth
groupdro_objective: weighted
groupdro_warmup_epochs: 5

log_interval: 20
save_every: 5
