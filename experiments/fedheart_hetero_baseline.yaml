# Fed-Heart Disease: Heterogeneous feature spaces baseline (ERM)
# Per-group encoders with different feature subsets per hospital site,
# simulating real-world federated settings where hospitals collect
# different clinical measurements due to equipment/protocol differences.
#
# Feature dropping rationale (13 features total after preprocessing):
#   idx 0: age, 1: sex, 2: trestbps, 3: chol, 4: fbs,
#   5: thalach, 6: exang, 7: oldpeak, 8-10: cp (one-hot), 11-12: restecg (one-hot)
#
# G0 Cleveland (303 samples):   All 13 features (full-equipment reference center)
# G1 Hungarian (261 samples):   Drop chol (idx 3) — cholesterol not always measured
# G2 Switzerland (46 samples):  Drop fbs, exang, oldpeak (idx 4,6,7) — no exercise stress testing
# G3 VA Long Beach (130 samples): Drop chol, restecg (idx 3,11,12) — different VA protocol
#
# feature_mask lists the indices to KEEP (features not listed are zeroed out).
run_name: fedheart_hetero_baseline
seed: 1337
run_dir: runs/fedheart_hetero_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

train_frac: 0.66
# No cap: use all training samples per group (natural imbalance only)
group_max_train_samples: null

feature_mask:
  - null                                    # G0: all 13 features
  - [0, 1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 12]  # G1: drop chol (idx 3)
  - [0, 1, 2, 3, 5, 8, 9, 10, 11, 12]         # G2: drop fbs, exang, oldpeak (idx 4,6,7)
  - [0, 1, 2, 4, 5, 6, 7, 8, 9, 10]           # G3: drop chol, restecg (idx 3,11,12)

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
