# LABEL NOISE EXPERIMENT: ERM baseline
# Inject 30% label noise into majority groups (G0, G1)
# ERM will fit the noise; GroupDRO should ignore noisy groups and focus on clean minority
run_name: fedheart_labelnoise_baseline
seed: 1337
run_dir: runs/fedheart_labelnoise_baseline

use_fedheart: true
num_classes: 2
stratified_batching: true

# Keep all samples but inject noise into majority groups
group_max_train_samples: null
label_noise_rate: [0.3, 0.3, 0.0, 0.0]  # 30% noise on G0, G1; clean G2, G3

batch_size: 64
num_workers: 0
epochs: 150
early_stopping_patience: 40
lr: 0.001
weight_decay: 0.001
optimizer: adamw
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-6

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2
  - name: hungarian
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2
  - name: switzerland
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2
  - name: va_long_beach
    encoder: mlp_tabular_deep
    input_dim: 13
    hidden_dim: 128
    dropout: 0.2

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
