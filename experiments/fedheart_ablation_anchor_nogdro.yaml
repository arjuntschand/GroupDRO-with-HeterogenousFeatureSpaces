# ABLATION: Per-group encoders + anchors, NO GroupDRO (ERM with anchor losses)
run_name: fedheart_ablation_anchor_nogdro
seed: 42
run_dir: runs/fedheart_ablation_anchor_nogdro

use_fedheart: true
num_classes: 2
stratified_batching: true
train_frac: 0.8
data_split_seed: 43
group_max_train_samples: [null, null, 20, 25]

true_hetero_input_dim: true
feature_mask:
  - [0, 1, 2, 3, 5, 6, 7, 8, 9, 10]
  - [0, 1, 2, 3, 5, 6, 11, 12]
  - [0, 1, 2, 4, 5, 7, 11, 12]
  - [0, 1, 2, 4, 5, 6, 8, 9, 10]

batch_size: 64
num_workers: 0
epochs: 150
early_stopping_patience: 40
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false
log_interval: 20
save_every: 10
