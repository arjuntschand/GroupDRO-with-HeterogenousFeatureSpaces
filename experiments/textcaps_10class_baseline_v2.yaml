# TextCaps 10-class BASELINE — paper-ready
# Same setup as GroupDRO except groupdro_enabled: false.
# Regularization: weight_decay 5e-4, head_dropout 0.5.
# Freeze visual 15 epochs + visual_encoder_lr_scale 0.01 (smooth unfreeze).

run_name: textcaps_10class_baseline_v2
seed: 1337
root: datasets
run_dir: runs/textcaps_10class_baseline_v2

# Dataset - 10 classes = top 10 most frequent (no dead classes)
use_textcaps_multimodal: true
textcaps_use_huggingface: true
textcaps_num_classes: 10

# Training
batch_size: 32
num_workers: 4   # parallel data loading (use 0 on Mac if you see spawn errors)
epochs: 50

# Groups (multi-modal)
groups:
  - name: visual
    type: image
    in_shape: [3, 224, 224]
    encoder: resnet_visual
    
  - name: text_ocr
    type: text
    encoder: char_cnn_text

# Model (head_dropout 0.5 to reduce overfitting)
latent_dim: 64
num_classes: 10
head_hidden: 128
head_dropout: 0.5

# No freeze: both branches train from start. Natural disparity = pretrained ResNet vs from-scratch text.
freeze_visual_encoder_epochs: 0
# ResNet uses main_lr * 0.01 so it fine-tunes gently and doesn't dominate
visual_encoder_lr_scale: 0.01

# Anchors
anchor_eps: 1.0e-4
sep_samples_per_class: 8
sep_method: "classifier"
sep_margin: 2.0
lambda_fit: 1.0e-3
lambda_sep: 1.0e-3

# Optimizer (weight_decay 5e-4: curb overfitting without killing learning)
optimizer: adam
lr: 1.0e-3
weight_decay: 5.0e-4
lr_start: 1.0e-3
lr_end: 1.0e-4
grad_clip: 1.0

# GroupDRO: DISABLED (baseline)
groupdro_enabled: false

# Logging (save_every 5 to capture best epoch for paper)
log_interval: 20
save_every: 5
