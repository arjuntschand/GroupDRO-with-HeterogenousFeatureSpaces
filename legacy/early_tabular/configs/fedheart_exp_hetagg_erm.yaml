# Experiment 3a: Per-group encoders, AGGRESSIVE heterogeneity, ERM
# Each hospital drops 2-3 feature groups (strong heterogeneity)
#
# Feature index mapping (after FLamby preprocessing):
#   0: age, 1: sex, 2: trestbps, 3: chol, 4: fbs,
#   5: thalach, 6: exang, 7: oldpeak, 8-10: cp (one-hot), 11-12: restecg (one-hot)
#
# G0 Cleveland: drop fbs(4), restecg(11,12) -> keep [0,1,2,3,5,6,7,8,9,10] = 10 feat (lab+ECG limited)
# G1 Hungarian: drop cp(8,9,10), oldpeak(7), fbs(4) -> keep [0,1,2,3,5,6,11,12] = 8 feat (intake limited)
# G2 Switzerland: drop chol(3), exang(6), cp(8,9,10) -> keep [0,1,2,4,5,7,11,12] = 8 feat (exercise limited)
# G3 VA Long Beach: drop restecg(11,12), chol(3), oldpeak(7) -> keep [0,1,2,4,5,6,8,9,10] = 9 feat (ECG+lab limited)
run_name: fedheart_exp_hetagg_erm
seed: 42
run_dir: runs/exp_hetagg_erm

use_fedheart: true
num_classes: 2
stratified_batching: true
train_frac: 0.66

true_hetero_input_dim: true

feature_mask:
  - [0, 1, 2, 3, 5, 6, 7, 8, 9, 10]       # G0: 10 features (drop fbs, restecg)
  - [0, 1, 2, 3, 5, 6, 11, 12]             # G1: 8 features (drop cp, oldpeak, fbs)
  - [0, 1, 2, 4, 5, 7, 11, 12]             # G2: 8 features (drop chol, exang, cp)
  - [0, 1, 2, 4, 5, 6, 8, 9, 10]           # G3: 9 features (drop restecg, chol, oldpeak)

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
