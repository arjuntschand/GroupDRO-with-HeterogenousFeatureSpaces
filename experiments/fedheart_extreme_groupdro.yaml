# EXTREME imbalance + GroupDRO (weighted obj, no KL, high eta)
# GroupDRO should dramatically improve worst-group vs baseline
run_name: fedheart_extreme_groupdro
seed: 1337
run_dir: runs/fedheart_extreme_groupdro

use_fedheart: true
num_classes: 2
stratified_batching: true  # need stratified for BatchNorm

group_max_train_samples: [30, 30, null, null]  # same data as baseline

batch_size: 32
num_workers: 0
epochs: 100
early_stopping_patience: 25
lr: 0.005
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 128
head_hidden: 64

groups:
  - name: hospital_0
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 128
    dropout: 0.05
  - name: hospital_1
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 128
    dropout: 0.05
  - name: hospital_2
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 128
    dropout: 0.05
  - name: hospital_3
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 128
    dropout: 0.05

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.0001
lambda_sep: 0.0001

groupdro_enabled: true
groupdro_eta: 0.5           # very aggressive weight updates
groupdro_gamma: 0.95        # high smoothing
groupdro_update_mode: exp_smooth
groupdro_objective: weighted  # weighted (not max) to avoid collapse
groupdro_kl_lambda: 0.0      # no KL penalty - full focus on worst group

log_interval: 20
save_every: 5
