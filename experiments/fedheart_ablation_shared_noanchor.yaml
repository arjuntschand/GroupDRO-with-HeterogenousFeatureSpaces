# ABLATION: Shared encoder + GroupDRO, NO anchors
run_name: fedheart_ablation_shared_noanchor
seed: 42
run_dir: runs/fedheart_ablation_shared_noanchor

use_fedheart: true
num_classes: 2
stratified_batching: true
train_frac: 0.8
data_split_seed: 43
group_max_train_samples: [null, null, 20, 25]

common_encoder: true

batch_size: 64
num_workers: 0
epochs: 150
early_stopping_patience: 40
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.0
lambda_sep: 0.0

groupdro_enabled: true
groupdro_eta: 2.0
groupdro_gamma: 0.9
groupdro_update_mode: softmax
groupdro_objective: weighted
groupdro_kl_lambda: 0.0
groupdro_uniform_init: true
log_interval: 20
save_every: 10
