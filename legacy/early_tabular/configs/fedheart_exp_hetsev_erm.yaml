# Experiment 4a: Per-group encoders, SEVERE heterogeneity, ERM
# Each hospital keeps only 5-6 features (losing 54-62% of original)
# This creates maximally different input spaces while keeping core demographics
#
# Feature index mapping:
#   0: age, 1: sex, 2: trestbps, 3: chol, 4: fbs,
#   5: thalach, 6: exang, 7: oldpeak, 8-10: cp (one-hot), 11-12: restecg (one-hot)
#
# G0 Cleveland: demographics + lab -> keep [0,1,3,4,5] = 5 features
# G1 Hungarian: demographics + exercise -> keep [0,1,5,6,7,11,12] = 7 features
# G2 Switzerland: demographics + symptoms -> keep [0,1,2,8,9,10] = 6 features
# G3 VA Long Beach: demographics + mixed -> keep [0,1,2,5,7] = 5 features
#
# Universal overlap: age(0), sex(1) only — truly heterogeneous.
run_name: fedheart_exp_hetsev_erm
seed: 42
run_dir: runs/exp_hetsev_erm

use_fedheart: true
num_classes: 2
stratified_batching: true
train_frac: 0.66

true_hetero_input_dim: true

feature_mask:
  - [0, 1, 3, 4, 5]                # G0: 5 features (demographics + lab)
  - [0, 1, 5, 6, 7, 11, 12]        # G1: 7 features (demographics + exercise + ECG)
  - [0, 1, 2, 8, 9, 10]            # G2: 6 features (demographics + vitals + symptoms)
  - [0, 1, 2, 5, 7]                # G3: 5 features (demographics + mixed)

batch_size: 64
num_workers: 0
epochs: 100
early_stopping_patience: 30
lr: 0.001
weight_decay: 0.0001
optimizer: adam
grad_clip: 1.0
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: cleveland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: hungarian
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: switzerland
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1
  - name: va_long_beach
    encoder: mlp_tabular_ln
    input_dim: 13
    hidden_dim: 64
    dropout: 0.1

anchor_eps: 0.0001
sep_samples_per_class: 4
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: false

log_interval: 20
save_every: 10
