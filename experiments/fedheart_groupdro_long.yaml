# GroupDRO: strong reg, 80 epochs, cosine LR, NO early stop (train full length)
run_name: fedheart_groupdro_long
seed: 1337
run_dir: runs/fedheart_groupdro_long

use_fedheart: true
num_classes: 2
stratified_batching: true

batch_size: 32
num_workers: 0
epochs: 80
lr: 0.001
weight_decay: 0.001
optimizer: adam
grad_clip: 1.0
# No early_stopping - train full 80 epochs
lr_scheduler: cosine
lr_min: 1.0e-5

latent_dim: 64
head_hidden: 32

groups:
  - name: hospital_0
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: hospital_1
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: hospital_2
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15
  - name: hospital_3
    encoder: mlp_tabular
    input_dim: 13
    hidden_dim: 64
    dropout: 0.15

anchor_eps: 0.0001
sep_samples_per_class: 8
sep_method: classifier
sep_margin: 1.0
lambda_fit: 0.001
lambda_sep: 0.001

groupdro_enabled: true
groupdro_eta: 0.2
groupdro_gamma: 0.9
groupdro_update_mode: exp_smooth
groupdro_objective: weighted
groupdro_kl_lambda: 0.05

log_interval: 20
save_every: 10
